# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family                 FiraCode Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

# Window
remember_window_size        no
initial_window_width        950
initial_window_height       500
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.9
dynamic_background_opacity  yes

# Cursor
cursor_shape beam
cursor_trail 0
cursor_blink_interval       0.5
cursor_stop_blinking_after  1

# Scrollback & bell
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no

# Selection keeps the text's own colors
selection_foreground        none
selection_background        none

# No stupid close confirmation
confirm_os_window_close 0

# Copy
map ctrl+c    copy_or_interrupt
# In Claude Code (marked by the claude wrapper in zshrc), pass Ctrl+Shift+C to its own copy
map --when-focus-on var:in_claude ctrl+shift+c

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+up    change_font_size all +2.0
map ctrl+down  change_font_size all -2.0
map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
